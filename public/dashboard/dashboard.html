<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackVault | Dashboard Analítica</title>
    <link rel="icon" href="../assets/logo.png">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<!-- Ao abrir a página, valida sessão e já carrega os KPIs e gráficos -->
<body onload="validarSessao(), carregarDashboardAnalitica()">
    <div class="dashboard-layout">

        <!-- Menu lateral fixo com identidade visual da referência -->
        <div class="menu-lateral">
            <div class="menu-topo">
                <img src="../assets/logo.png" alt="TrackVault" class="logo-menu">
                <h1>TRACKVAULT</h1>
            </div>

            <div class="menu-links">
                <a href="#" class="item-menu ativo">Dashboard</a>
                <a href="../interacao.html" class="item-menu">Minhas Tracks</a> <!-- aqui apontamos o menu Minhas Tracks para a tela de interação -->
            </div>

            <!-- Mantém o encerramento de sessão existente -->
            <button class="botao-sair" onclick="limparSessao()">Sair</button>
        </div>

        <!-- Conteúdo principal da dashboard -->
        <div class="conteudo-dashboard">
            <div class="cabecalho-dashboard">
                <div class="saudacao-linha">
                    <h2>Olá,</h2>
                    <div id="b_usuario" class="nome-usuario">usuário</div>
                    <h2>!</h2>
                </div>
                <p>Aqui está um resumo do seu catálogo musical.</p>
            </div>

            <!-- Linha de KPIs obrigatórios -->
            <div class="grade-kpis">
                <div class="card-kpi">
                    <p class="kpi-titulo">Total de Tracks</p>
                    <p id="kpi_total_tracks" class="kpi-valor">0</p>
                </div>

                <div class="card-kpi">
                    <p class="kpi-titulo">Total de Vertentes</p> <!-- aqui ajustamos o rótulo do KPI de vertentes -->
                    <p id="kpi_total_vertentes" class="kpi-valor">0</p>
                </div>

                <div class="card-kpi">
                    <p class="kpi-titulo">Total de Produtores</p> <!-- aqui ajustamos o rótulo do KPI de produtores -->
                    <p id="kpi_total_produtores" class="kpi-valor">0</p>
                </div>

                <div class="card-kpi">
                    <p class="kpi-titulo">Tracks Cadastradas no Mês</p> <!-- aqui ajustamos o rótulo do KPI mensal -->
                    <p id="kpi_tracks_mes" class="kpi-valor">0</p>
                </div>
            </div>

            <p id="msg_kpis" class="mensagem-vazia"></p>

            <!-- Primeira linha de gráficos: barras por vertente e linha de evolução -->
            <div class="grade-graficos-dupla">
                <div class="card-grafico">
                    <h2>Tracks por Vertente</h2>
                    <!-- Este canvas é a área onde o Chart.js desenha o gráfico de tracks por vertente. -->
                    <div class="area-canvas"><canvas id="grafico_vertentes_bar"></canvas></div>
                    <p id="msg_vertentes" class="mensagem-vazia"></p>
                </div>

                <div class="card-grafico">
                    <h2>Evolução do Catálogo</h2>
                    <!-- Este canvas é a área onde o Chart.js desenha o gráfico de evolução mensal. -->
                    <div class="area-canvas"><canvas id="grafico_evolucao_linha"></canvas></div>
                    <p id="msg_evolucao" class="mensagem-vazia"></p>
                </div>
            </div>

            <!-- Segunda linha: top 5 produtores em barras horizontais -->
            <div class="grade-graficos-unico">
                <div class="card-grafico">
                    <h2>Top 5 Produtores</h2>
                    <!-- Este canvas é a área onde o Chart.js desenha o ranking dos produtores. -->
                    <div class="area-canvas"><canvas id="grafico_top_produtores"></canvas></div>
                    <p id="msg_produtores" class="mensagem-vazia"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Referências dos gráficos para poder destruir/recriar quando necessário
        let graficoVertentesBar;
        let graficoEvolucaoLinha;
        let graficoTopProdutores;

        // Busca da API em estilo simples com .then/.catch.
        // Em caso de erro, chama a função de erro específica de cada bloco.
        function buscarJSON(url, aoSucesso, aoErro) {
            fetch(url) // aqui removemos o cache no-store para simplificar a função de busca
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (dados) {
                            aoSucesso(dados);
                        });
                    } else {
                        aoErro();
                    }
                })
                .catch(function (erro) {
                    console.log("Erro em " + url + ":", erro);
                    aoErro();
                });
        }

        // Este gráfico de barras compara a quantidade de tracks cadastradas em cada vertente musical.
        function montarGraficoVertentes(lista) {
            if (!lista || lista.length == 0) {
                msg_vertentes.innerHTML = "Sem dados de vertentes no momento.";
                return;
            }

            msg_vertentes.innerHTML = "";

            let labels = [];
            let valores = [];
            let i = 0; // aqui iniciamos o índice do while para montar labels e valores

            while (i < lista.length) { // aqui percorremos a lista de vertentes sem usar for
                labels[i] = lista[i].nome; // aqui preenchemos o vetor de labels por posição
                valores[i] = Number(lista[i].total); // aqui preenchemos o vetor de valores por posição
                i++; // aqui avançamos para o próximo item da lista
            }

            if (graficoVertentesBar) {
                graficoVertentesBar.destroy();
            }

            let ctx = grafico_vertentes_bar.getContext("2d");

            graficoVertentesBar = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: "#7A2CFF", // aqui aplicamos cor sólida roxa nas barras
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#EAF0FF" },
                            grid: { color: "rgba(120, 130, 170, 0.15)" }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { color: "#EAF0FF", precision: 0 },
                            grid: { color: "rgba(120, 130, 170, 0.15)" }
                        }
                    }
                }
            });
        }

        // Este gráfico de linha apresenta a evolução mensal dos novos cadastros de tracks no catálogo.
        function montarGraficoEvolucao(lista) {
            if (!lista || lista.length == 0) {
                msg_evolucao.innerHTML = "Sem dados mensais no momento.";
                return;
            }

            msg_evolucao.innerHTML = "";

            let mesesPt = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
            let labels = [];
            let valores = [];
            let i = 0; // aqui iniciamos o índice do while para montar os pontos da evolução

            while (i < lista.length) { // aqui percorremos a lista vinda da API sem usar for
                labels[i] = mesesPt[Number(lista[i].mes) - 1]; // aqui montamos o label direto pelo mês retornado pela API
                valores[i] = Number(lista[i].total); // aqui montamos o valor direto da API por posição
                i++; // aqui avançamos para o próximo mês retornado
            }

            if (graficoEvolucaoLinha) {
                graficoEvolucaoLinha.destroy();
            }

            let ctx = grafico_evolucao_linha.getContext("2d");

            graficoEvolucaoLinha = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        borderColor: "#00E5FF", // aqui aplicamos cor sólida ciano na linha
                        backgroundColor: "#00E5FF", // aqui deixamos a cor sólida do dataset sem gradiente
                        fill: false, // aqui removemos o preenchimento em área para simplificar
                        tension: 0.35,
                        pointRadius: 5,
                        pointHoverRadius: 6,
                        pointBackgroundColor: "#00E5FF"
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#EAF0FF" },
                            grid: { color: "rgba(120, 130, 170, 0.15)" }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { color: "#EAF0FF", precision: 0 },
                            grid: { color: "rgba(120, 130, 170, 0.15)" }
                        }
                    }
                }
            });
        }

        // Este gráfico identifica os cinco produtores com maior quantidade de tracks cadastradas.
        function montarGraficoTopProdutores(lista) {
            if (!lista || lista.length == 0) {
                msg_produtores.innerHTML = "Sem produtores cadastrados para ranking.";
                return;
            }

            msg_produtores.innerHTML = "";

            let labels = [];
            let valores = [];
            let i = 0; // aqui iniciamos o índice do while para montar o top produtores

            while (i < lista.length) { // aqui percorremos o ranking de produtores sem usar for
                labels[i] = lista[i].nome; // aqui preenchemos o vetor de labels por posição
                valores[i] = Number(lista[i].total); // aqui preenchemos o vetor de valores por posição
                i++; // aqui avançamos para o próximo produtor
            }

            if (graficoTopProdutores) {
                graficoTopProdutores.destroy();
            }

            let ctx = grafico_top_produtores.getContext("2d");
            graficoTopProdutores = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: "#7A2CFF",
                        borderRadius: 8
                    }]
                },
                options: {
                    indexAxis: "y",
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: { color: "#EAF0FF", precision: 0 },
                            grid: { color: "rgba(120, 130, 170, 0.15)" }
                        },
                        y: {
                            ticks: { color: "#EAF0FF" },
                            grid: { color: "rgba(120, 130, 170, 0.08)" }
                        }
                    }
                }
            });
        }

        // Função principal: busca os dados do back-end e atualiza toda a dashboard
        function carregarDashboardAnalitica() {
            buscarJSON(
                "/painel/resumo",
                function (dados) {
                    atualizarKPIs(dados || {});
                },
                function () {
                    msg_kpis.innerHTML = "Não foi possível carregar os indicadores agora.";
                }
            );

            buscarJSON(
                "/painel/por-vertente",
                function (dados) {
                    montarGraficoVertentes(dados || []);
                },
                function () {
                    msg_vertentes.innerHTML = "Erro ao carregar o gráfico de vertentes.";
                }
            );

            buscarJSON(
                "/painel/evolucao-catalogo",
                function (dados) {
                    montarGraficoEvolucao(dados || []);
                },
                function () {
                    msg_evolucao.innerHTML = "Erro ao carregar a evolução do catálogo.";
                }
            );

            buscarJSON(
                "/painel/top-produtores",
                function (dados) {
                    montarGraficoTopProdutores(dados || []);
                },
                function () {
                    msg_produtores.innerHTML = "Erro ao carregar o ranking de produtores.";
                }
            );
        }

        // Limpa a mensagem de erro dos KPIs quando eles carregam.
        function atualizarKPIs(resumo) {
            msg_kpis.innerHTML = "";
            kpi_total_tracks.innerHTML = resumo.totalTracks || 0;
            kpi_total_vertentes.innerHTML = resumo.totalVertentes || 0;
            kpi_total_produtores.innerHTML = resumo.totalProdutores || 0;
            kpi_tracks_mes.innerHTML = resumo.tracksMesAtual || 0;
        }

    </script>
</body>

</html>
